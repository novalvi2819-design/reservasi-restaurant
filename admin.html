<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel Reservasi</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  padding: 30px;
}

.container {
  max-width: 900px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

button {
  padding: 8px 15px;
  background: #1e88e5;
  color: white;
  border: none;
  cursor: pointer;
}

.login-box {
  max-width: 400px;
  margin: 100px auto;
  background: white;
  padding: 30px;
  border-radius: 10px;
}
</style>
</head>
<body>

<div id="loginSection" class="login-box">
  <h2>Login Admin</h2>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>
</div>

<div id="adminSection" class="container" style="display:none;">
  <h2>Daftar Reservasi</h2>
  <div id="listReservasi"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = supabase.createClient(
  "https://kpkwnhiuqkrmfnevbfku.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtwa3duaGl1cWtybWZuZXZiZmt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NTY2NTUsImV4cCI6MjA4NzMzMjY1NX0.JdYLPJHgmmwK74pMow4bThWucGvf4SAQfVUkbCs3cck"
)

// ================= LOGIN =================
async function login() {
  const { error } = await supabase.auth.signInWithPassword({
    email: email.value,
    password: password.value
  })

  if (error) {
    alert("Login gagal")
  } else {
    document.getElementById("loginSection").style.display = "none"
    document.getElementById("adminSection").style.display = "block"
    loadReservasi()
  }
}

// ================= LOAD DATA =================
async function loadReservasi() {

  const { data } = await supabase
    .from("reservasi")
    .select("*")
    .order("dibuat_pada", { ascending: false })

  const container = document.getElementById("listReservasi")
  container.innerHTML = ""

  data.forEach(item => {
    container.innerHTML += `
      <div class="card">
        <b>${item.nama_tamu}</b><br>
        Tanggal: ${item.tanggal_reservasi}<br>
        Jam: ${item.jam_kedatangan}<br>
        Status: ${item.status_reservasi}<br><br>

        ${
          item.status_reservasi === "menunggu_konfirmasi"
          ? `<button onclick="konfirmasi('${item.id}')">Konfirmasi</button>`
          : ""
        }
      </div>
    `
  })
}

// ================= KONFIRMASI =================
async function konfirmasi(idReservasi) {

  await fetch("https://kpkwnhiuqkrmfnevbfku.supabase.co/functions/v1/konfirmasi_reservasi", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer ANON_KEY_ANDA"
    },
    body: JSON.stringify({
      id: idReservasi
    })
  })

  alert("Reservasi dikonfirmasi")
  loadReservasi()
}
</script>

</body>
</html>
