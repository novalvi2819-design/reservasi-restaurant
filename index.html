<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservasi Restaurant</title>

<style>
body {
  font-family: Arial;
  background: #f5f7fa;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  padding: 30px;
  width: 400px;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

input, select {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
}

button {
  width: 100%;
  padding: 12px;
  background: #1e88e5;
  color: white;
  border: none;
}
</style>
</head>
<body>

<div class="card">
<h2>Form Reservasi</h2>

<form id="formReservasi">
<input type="text" id="nama" placeholder="Nama Tamu" required>
<input type="text" id="whatsapp" placeholder="Nomor WhatsApp" required>
<input type="date" id="tanggal" required>
<input type="time" id="jam" required>
<input type="number" id="jumlah" placeholder="Jumlah Tamu" required>

<button type="submit">Kirim Reservasi</button>
</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = supabase.createClient(
  "https://kpkwnhiuqkrmfnevbfku.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtwa3duaGl1cWtybWZuZXZiZmt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NTY2NTUsImV4cCI6MjA4NzMzMjY1NX0.JdYLPJHgmmwK74pMow4bThWucGvf4SAQfVUkbCs3cck"
)

document.getElementById("formReservasi")
.addEventListener("submit", async (e) => {
  e.preventDefault()

  await supabase.from("reservasi").insert([{
    nama_tamu: nama.value,
    nomor_whatsapp: whatsapp.value,
    tanggal_reservasi: tanggal.value,
    jam_kedatangan: jam.value,
    jumlah_tamu: jumlah.value,
    status_reservasi: "menunggu_konfirmasi"
  }])

  alert("Reservasi berhasil dikirim!")
})
</script>

</body>
</html>
