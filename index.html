<!DOCTYPE html>
<html>
<head>
  <title>Reservasi Restaurant</title>
</head>
<body>

<h2>Form Reservasi</h2>

<form id="formReservasi">
  <input type="text" id="nama" placeholder="Nama Tamu" required><br><br>
  <input type="text" id="whatsapp" placeholder="Nomor WhatsApp" required><br><br>
  <input type="date" id="tanggal" required><br><br>
  <input type="time" id="jam" required><br><br>
  <input type="number" id="jumlah" placeholder="Jumlah Tamu"><br><br>

  <button type="submit">Kirim Reservasi</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = supabase.createClient(
  "URL_SUPABASE_ANDA",
  "ANON_KEY_ANDA"
)

document.getElementById("formReservasi").addEventListener("submit", async function(e){
  e.preventDefault()

  const { data, error } = await supabase
    .from("reservasi")
    .insert([
      {
        nama_tamu: document.getElementById("nama").value,
        nomor_whatsapp: document.getElementById("whatsapp").value,
        tanggal_reservasi: document.getElementById("tanggal").value,
        jam_kedatangan: document.getElementById("jam").value,
        jumlah_tamu: document.getElementById("jumlah").value,
        status_reservasi: "menunggu_konfirmasi"
      }
    ])

  alert("Reservasi berhasil dikirim!")
})
</script>

</body>
</html>
