<!DOCTYPE html>
<html>
<head>
  <title>Form Reservasi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2b7cff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1f5fd6;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Form Reservasi</h2>

  <form>
    <input type="text" placeholder="Nama Tamu" required>
    <input type="text" placeholder="Nomor WhatsApp" required>
    <input type="date" required>
    <input type="time" required>
    <input type="number" placeholder="Jumlah Tamu" required>
    <button type="submit">Kirim Reservasi</button>
  </form>
</div>

</body>
</html>
