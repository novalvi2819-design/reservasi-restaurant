<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================
   🔐 KONEKSI SUPABASE
========================= */

const supabaseClient = window.supabase.createClient(
  "https://kpkwnhiuqkrmfnevbfku.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtwa3duaGl1cWtybWZuZXZiZmt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NTY2NTUsImV4cCI6MjA4NzMzMjY1NX0.JdYLPJHgmmwK74pMow4bThWucGvf4SAQfVUkbCs3cck"
);

/* =========================
   🎯 ELEMENT
========================= */

const form = document.getElementById("formReservasi");
const cabangSelect = document.getElementById("cabang");
const lantaiSelect = document.getElementById("lantai");
const mejaSelect = document.createElement("select");
mejaSelect.id = "meja";
mejaSelect.required = true;

/* Tambahkan dropdown meja setelah lantai */
lantaiSelect.insertAdjacentHTML("afterend",
  `<label>Pilih Meja</label>`);
lantaiSelect.after(mejaSelect);

/* =========================
   🔄 GENERATE UUID
========================= */
function generateUUID(){
  return crypto.randomUUID();
}

/* =========================
   🏢 LOAD CABANG
========================= */
async function loadCabang(){
  const { data } = await supabaseClient
    .from("cabang")
    .select("id,nama_cabang");

  cabangSelect.innerHTML =
    '<option value="">-- Pilih Cabang --</option>';

  data.forEach(c=>{
    cabangSelect.innerHTML +=
      `<option value="${c.id}">
        ${c.nama_cabang}
      </option>`;
  });
}

/* =========================
   🏬 LOAD LANTAI
========================= */
async function loadLantai(cabangId){
  const { data } = await supabaseClient
    .from("lantai")
    .select("id,nomor_lantai")
    .eq("cabang_id", cabangId);

  lantaiSelect.innerHTML =
    '<option value="">-- Pilih Lantai --</option>';

  mejaSelect.innerHTML = "";

  data.forEach(l=>{
    lantaiSelect.innerHTML +=
      `<option value="${l.id}">
        Lantai ${l.nomor_lantai}
      </option>`;
  });
}

/* =========================
   🍽 LOAD MEJA
   (Cek tanggal & jam)
========================= */
async function loadMeja(lantaiId){

  const tanggal = document.getElementById("tanggal").value;
  const jam = document.getElementById("jam").value;

  if(!tanggal || !jam){
    alert("Pilih tanggal & jam dulu");
    return;
  }

  const { data: mejaList } = await supabaseClient
    .from("meja")
    .select("*")
    .eq("id_lantai", lantaiId);

  mejaSelect.innerHTML =
    '<option value="">-- Pilih Meja --</option>';

  for(const m of mejaList){

    const { data: booked } = await supabaseClient
      .from("reservasi")
      .select("id")
      .eq("id_meja", m.id)
      .eq("tanggal_reservasi", tanggal)
      .eq("jam_kedatangan", jam)
      .eq("status_reservasi","confirm");

    const disabled =
      booked.length > 0 ? "disabled" : "";

    mejaSelect.innerHTML += `
      <option value="${m.id}" ${disabled}>
        Meja ${m.nomor_meja}
        (Kapasitas ${m.kapasitas})
      </option>
    `;
  }
}

/* =========================
   🎛 EVENT LISTENER
========================= */

cabangSelect.addEventListener("change", ()=>{
  loadLantai(cabangSelect.value);
});

lantaiSelect.addEventListener("change", ()=>{
  loadMeja(lantaiSelect.value);
});

/* =========================
   📩 SUBMIT FORM
========================= */

form.addEventListener("submit", async (e)=>{
  e.preventDefault();

  const idReservasi = generateUUID();
  const kodeReservasi = "RSV-" + Date.now();

  const { error } = await supabaseClient
  .from("reservasi")
  .insert([{
    id: idReservasi,
    kode_reservasi: kodeReservasi,
    nama_tamu: nama.value,
    nomor_whatsapp: whatsapp.value,
    email: email.value,
    tanggal_reservasi: tanggal.value,
    hari: new Date(tanggal.value)
           .toLocaleDateString("id-ID",
           {weekday:'long'}),
    jam_kedatangan: jam.value,
    jumlah_tamu: parseInt(jumlah.value),
    id_cabang: cabangSelect.value,
    id_lantai: lantaiSelect.value,
    id_meja: mejaSelect.value,
    catatan_tambahan: catatan.value,
    status_reservasi: "menunggu_konfirmasi",
    dibuat_pada: new Date().toISOString()
  }]);

  if(!error){
    successMsg.style.display="block";
    form.reset();
    mejaSelect.innerHTML="";
  }else{
    alert("Error: "+error.message);
  }

});

/* =========================
   🚀 INIT
========================= */

loadCabang();

</script>
